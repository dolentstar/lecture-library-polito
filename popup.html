<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #ffffff; --text: #1d1d1f; --muted: #86868b; --fill: rgba(118,118,128,.12);
      --chip: #ffffff; --accent: #0071e3; --track: rgba(118,118,128,.2); --hair: rgba(0,0,0,.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e; --text: #f5f5f7; --muted: #8e8e93; --fill: rgba(118,118,128,.24);
        --chip: #636366; --accent: #0a84ff; --track: rgba(118,118,128,.32); --hair: rgba(255,255,255,.08);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 272px; padding: 18px 18px 16px; background: var(--bg); color: var(--text);
      font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased; user-select: none;
    }
    .title { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
    .value {
      font-size: 44px; font-weight: 600; letter-spacing: -.02em; line-height: 1;
      font-variant-numeric: tabular-nums; margin: 10px 0 16px;
    }
    .value span { font-weight: 400; color: var(--muted); margin-left: 2px; }

    input[type=range] { -webkit-appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
    input[type=range]::-webkit-slider-runnable-track {
      height: 4px; border-radius: 2px;
      background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--track) var(--p, 0%));
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px; margin-top: -9px; border-radius: 50%;
      background: #fff; box-shadow: 0 0.5px 4px rgba(0,0,0,.12), 0 6px 13px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04);
      cursor: grab;
    }
    .scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin: 4px 1px 16px; }

    .seg { display: flex; padding: 2px; background: var(--fill); border-radius: 9px; }
    .seg button {
      flex: 1; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--text);
      font: 500 12px/1 inherit; font-family: inherit; cursor: pointer; transition: background .15s ease;
      font-variant-numeric: tabular-nums;
    }
    .seg button.on { background: var(--chip); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); font-weight: 600; }

    .custom {
      display: flex; align-items: center; margin-top: 12px; height: 34px; padding: 0 12px;
      background: var(--fill); border-radius: 9px;
    }
    .custom input {
      flex: 1; border: 0; outline: none; background: transparent; color: var(--text);
      font: inherit; font-variant-numeric: tabular-nums;
    }
    .custom input::placeholder { color: var(--muted); }
    .custom kbd { color: var(--muted); font: inherit; font-size: 12px; }

    .hint { margin-top: 14px; padding-top: 12px; border-top: .5px solid var(--hair); color: var(--muted); font-size: 11.5px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
    .hint kbd {
      display: inline-block; min-width: 18px; padding: 1px 5px; margin-right: 4px; text-align: center;
      border-radius: 5px; background: var(--fill); color: var(--text); font: 600 11px/16px inherit; font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="title">PLAYBACK SPEED</div>
  <div class="value"><b id="num">1</b><span>×</span></div>

  <input type="range" id="range" min="0.5" max="3" step="0.1" aria-label="Playback speed">
  <div class="scale"><span>0.5×</span><span>1×</span><span>1.5×</span><span>2×</span><span>2.5×</span><span>3×</span></div>

  <div class="seg" id="seg">
    <button data-v="1">1×</button>
    <button data-v="1.25">1.25×</button>
    <button data-v="1.5">1.5×</button>
    <button data-v="1.75">1.75×</button>
    <button data-v="2">2×</button>
  </div>

  <label class="custom">
    <input id="custom" type="text" inputmode="decimal" placeholder="Custom speed" spellcheck="false">
    <kbd>↩</kbd>
  </label>

  <div class="hint"><span><kbd>+</kbd>Faster</span><span><kbd>−</kbd>Slower</span><span><kbd>←</kbd>Back 10 s</span><span><kbd>→</kbd>Forward 10 s</span><span><kbd>0</kbd>Normal speed</span></div>
  <script src="popup.js"></script>
</body>
</html>
